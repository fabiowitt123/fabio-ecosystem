.context-cta .cta-primary,.donation-box .donate-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:900;border:0;cursor:pointer}
.context-cta .cta-primary{background:#fff;color:#14375f}.context-cta .cta-secondary{display:inline-flex;align-items:center;padding:12px 16px;border:1px solid #ffffff55;border-radius:10px;color:#fff;text-decoration:none;font-weight:850}

.donation-box h3{margin:0 0 5px;color:#14375f}.donation-box p{margin:0;color:#647a8e;font-size:12px;max-width:720px}
.donation-box .donate-btn{background:#1776bd;color:#fff}.donation-box small{display:block;margin-top:7px;color:#8a9aa7;font-size:9px}
@media(max-width:760px){.context-cta,.donation-box{display:block}.context-cta .cta-actions{margin-top:15px}.donation-box .donate-btn{margin-top:14px;width:100%}}
</style><style>/* v34 final CTA */.page-final-cta{margin:32px auto;padding:0 16px}.page-final-cta__inner{width:min(1180px,100%);margin:auto;padding:26px;border-radius:20px;background:linear-gradient(135deg,#0d3158,#247c82);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px}.page-final-cta__inner span{font-size:9px;font-weight:900;letter-spacing:.12em;color:#8ee4d0}.page-final-cta__inner h2{margin:6px 0;color:#fff;font-size:28px}.page-final-cta__inner p{margin:0;color:#dcebf1;max-width:720px}.page-final-cta__inner>a{flex:0 0 auto;padding:12px 15px;border-radius:10px;background:#fff;color:#14375f;text-decoration:none;font-weight:900}@media(max-width:720px){.page-final-cta__inner{display:block}.page-final-cta__inner>a{display:inline-flex;margin-top:14px}}</style><style>/* v37 shared quality */html{scroll-behavior:smooth}body{overflow-x:hidden}img,svg,video{max-width:100%}input,select,textarea,button{box-sizing:border-box}@media(max-width:980px){.main-nav{max-height:calc(100vh - 70px);overflow:auto}}</style></head><body><p><a href="dachwerk/blog.html">Zum DACHWERK SAP Blog</a></p><script src="shared-assets/site-config.js"></script>
<script data-paypal-script="v32">
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll("[data-paypal-donate]").forEach(a=>{
    const url=window.FW_SITE_CONFIG?.paypalDonationUrl||"";
    if(url && !url.includes("DEIN_PAYPAL_BUTTON_ID")) a.href=url;
    else {
      a.addEventListener("click",e=>{
        e.preventDefault();
        alert("PayPal-Spendenlink ist noch nicht konfiguriert. Bitte die echte PayPal-Donate-ID in shared-assets/site-config.js eintragen.");
      });
    }
  });
});
</script>

<section class="page-final-cta">
  <div class="page-final-cta__inner">
    <div><span>FABIO WITT</span><h2>Kontakt aufnehmen</h2><p>Für SAP-Beratung, Sprachunterricht oder digitale Lernangebote.</p></div>
    <a href="index.html">Anfrage senden</a>
  </div>
</section>
</body></html>
